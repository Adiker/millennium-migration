name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: bash ./tests/test-linux.sh

  windows:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        shell: pwsh
        run: ./tests/test-windows.ps1
